<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0c0e13">
  <title>Ask Vi Games</title>
  <link rel="icon" type="image/png" href="./src/assets/vi/pose-1.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/main.css">
  <script>
    // Applied synchronously, before first paint, so a saved light-theme choice
    // never flashes dark first. Kept out of main.js (a deferred module) on purpose.
    try {
      if (localStorage.getItem('gc_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) { /* storage unavailable; default (dark) theme is used */ }
  </script>
</head>
<body>
  <div class="app" id="app">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <nav class="sidebar" id="sidebar" aria-label="Chat history">
      <div class="sidebar-brand">
        <h1>Ask Vi Games</h1>
        <span class="sidebar-brand-sub">a meldCX product</span>
      </div>
      <div class="sidebar-head">
        <button class="sidebar-new" id="newChat" type="button">
          <span class="sidebar-new-main"><span class="sidebar-new-icon" aria-hidden="true">+</span>New chat</span>
          <span class="sidebar-new-shortcut" aria-hidden="true">⌥N</span>
        </button>
      </div>
      <div class="sidebar-search">
        <input type="search" id="chatSearch" placeholder="Search chats…" aria-label="Search chats">
      </div>
      <div class="sidebar-tabs" id="sidebarTabs" role="tablist" aria-label="Sidebar view">
        <button class="sidebar-tab" id="tabChats" type="button" role="tab" aria-selected="true" aria-controls="chatList">Chats <span class="sidebar-tab-count" id="chatCount">0</span></button>
        <button class="sidebar-tab" id="tabPrompts" type="button" role="tab" aria-selected="false" aria-controls="chatList">Saved prompts <span class="sidebar-tab-count" id="promptCount">0</span></button>
      </div>
      <div class="sidebar-error" id="sidebarError" role="alert" hidden></div>
      <ul class="chat-list" id="chatList" aria-label="Previous chats"></ul>
      <div class="sidebar-foot">
        <button class="sidebar-trash-toggle" id="chatTrashToggle" type="button" aria-pressed="false">🗑 Recently deleted</button>
      </div>
    </nav>

    <section class="chat" aria-label="Chat">
      <header class="chat-head">
        <div class="chat-head-left">
          <button class="ghost icon-btn" id="sidebarToggle" type="button" aria-label="Toggle chat history" aria-expanded="true">☰</button>
        </div>
        <div class="head-actions">
          <button class="ghost icon-btn theme-toggle" id="themeToggle" type="button" aria-label="Switch to light theme">🌙</button>
        </div>
      </header>

      <div class="banner" id="banner" hidden></div>

      <main class="messages" id="messages" aria-live="polite"></main>

      <div class="status" id="status" role="status" hidden></div>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-main">
          <div class="saved-chip" id="savedChip" hidden>
            <span class="saved-chip-text">⚡ Saved prompt<span id="savedChipTitle"></span> — builds instantly on Send</span>
            <button type="button" class="saved-chip-close" id="savedChipClose" aria-label="Use as a normal message instead">✕</button>
          </div>
          <textarea id="input" rows="1" maxlength="4000" placeholder="Describe a game idea, or just chat…" aria-label="Message"></textarea>
          <div class="composer-tools">
            <button type="button" class="composer-tool" id="savePrompt" title="Save what's in the message box as a build-ready prompt">🔖 Save prompt</button>
            <div class="composer-hint" aria-hidden="true">Enter send · Shift+Enter new line</div>
          </div>
        </div>
        <button type="submit" id="send">Send</button>
        <button type="button" id="stop" class="ghost" hidden>Stop</button>
      </form>
    </section>
  </div>
  <!-- Save Prompt modal: a saved prompt is a finalized, build-ready game prompt
       (see main.js openSavePromptModal). -->
  <dialog class="prompt-modal" id="savePromptModal" aria-labelledby="savePromptHeading">
    <form class="prompt-modal-form" id="savePromptForm" method="dialog" novalidate>
      <div class="prompt-modal-head">
        <img class="prompt-modal-vi" src="./src/assets/vi/pose-1.png" alt="" aria-hidden="true">
        <div>
          <h2 id="savePromptHeading">Save Prompt</h2>
          <p>Saved prompts are build-ready: using one starts building the game right away — no questions.</p>
        </div>
      </div>
      <label class="prompt-field">
        <span>Name</span>
        <input type="text" id="savePromptName" maxlength="80" placeholder="e.g. Neon Snake" autocomplete="off">
      </label>
      <label class="prompt-field">
        <span>Prompt</span>
        <textarea id="savePromptText" rows="7" maxlength="20000" placeholder="Describe the game exactly as it should be built — genre, controls, rules, look and feel. Anything you leave out gets a sensible default."></textarea>
      </label>
      <div class="prompt-field-row">
        <label class="prompt-field">
          <span>Type</span>
          <select id="savePromptType">
            <option value="any">Any game</option>
            <option value="arcade">Arcade</option>
            <option value="platformer">Platformer</option>
            <option value="puzzle">Puzzle</option>
            <option value="shooter">Shooter</option>
            <option value="racing">Racing</option>
            <option value="strategy">Strategy</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label class="prompt-field">
          <span>Run automatically</span>
          <select id="savePromptRunAuto">
            <option value="no">No — put it in the chat box first</option>
            <option value="yes">Yes — build as soon as it's clicked</option>
          </select>
        </label>
      </div>
      <label class="prompt-check">
        <input type="checkbox" id="savePromptShowHome">
        <span>Show on the New Chat screen</span>
      </label>
      <div class="prompt-modal-error" id="savePromptError" role="alert" hidden></div>
      <div class="prompt-modal-actions">
        <button type="button" class="ghost" id="savePromptCancel">Cancel</button>
        <button type="submit" id="savePromptSubmit">Save Prompt</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
