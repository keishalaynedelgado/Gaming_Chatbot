<!doctype html>
<!--
  The iPhone, iPad & Mac app for an exported game: a web page that installs
  from the browser (Safari: Share > Add to Home Screen on iPhone and iPad,
  File > Add to Dock on a Mac; Chrome and Edge: Install). Built by
  exporter.js, which fills in the game's title, the sandbox flags and the
  whole game inlined into one HTML document. The game runs in a sandboxed iframe,
  exactly as in the live preview (see PLAY_CSP in config/constants.js); this
  page only adds the app's name, icon, offline copy (sw.js) and a short
  "how to install" note when it's opened in the browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>{{TITLE}}</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{TITLE}}">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #game { display: block; width: 100%; height: 100%; border: 0; }
  #install {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    box-sizing: border-box; width: max-content; max-width: calc(100% - 24px);
    display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px;
    color: #fff; background: rgba(28, 30, 38, 0.94); border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
  }
  #install[hidden], #install button[hidden] { display: none; }
  #install button {
    flex: none; font: inherit; color: #fff; cursor: pointer;
    border: 0; border-radius: 9px; padding: 6px 12px; background: #5a52c8;
  }
  #install #install-close { padding: 6px 10px; background: transparent; font-size: 18px; line-height: 1; }
</style>
</head>
<body>
<iframe id="game" title="{{TITLE}}" sandbox="{{SANDBOX}}" allow="autoplay; fullscreen; gamepad" allowfullscreen srcdoc="{{GAME}}"></iframe>
<div id="install" role="status" hidden>
  <span id="install-text"></span>
  <button id="install-button" type="button" hidden>Install</button>
  <button id="install-close" type="button" aria-label="Close">&times;</button>
</div>
<script>
(function () {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  var frame = document.getElementById('game');
  frame.addEventListener('load', function () { frame.focus(); });

  // Opened from its Home Screen or Dock icon: nothing to explain.
  var installed = navigator.standalone === true
    || matchMedia('(display-mode: standalone)').matches
    || matchMedia('(display-mode: fullscreen)').matches;
  var KEY = 'askvi-install-note-closed';
  var banner = document.getElementById('install');
  var text = document.getElementById('install-text');
  var button = document.getElementById('install-button');
  var installPrompt = null;

  function closed() {
    try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; }
  }
  function show(html) {
    if (installed || closed()) return;
    text.innerHTML = html;
    banner.hidden = false;
  }
  document.getElementById('install-close').addEventListener('click', function () {
    banner.hidden = true;
    try { localStorage.setItem(KEY, '1'); } catch (e) { /* it just shows again next time */ }
    frame.focus();
  });

  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var safari = /Safari\//.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|EdgiOS|Edg\/|OPR/.test(ua);
  if (ios) show('To install, tap <b>Share</b>, then <b>Add to Home Screen</b>.');
  else if (/Macintosh/.test(ua) && safari) show('To install, choose <b>File &gt; Add to Dock</b>.');

  // Chrome and Edge (also on a Mac) offer their own install prompt.
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installPrompt = e;
    button.hidden = false;
    show('Install this game as an app.');
  });
  button.addEventListener('click', function () {
    if (!installPrompt) return;
    installPrompt.prompt();
    installPrompt = null;
    banner.hidden = true;
  });
  window.addEventListener('appinstalled', function () { banner.hidden = true; });
})();
</script>
</body>
</html>
